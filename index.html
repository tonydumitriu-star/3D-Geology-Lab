<!DOCTYPE html>
<html>
<head>
    <title>Hartă Geologică 3D - Pietroasa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- AICI SE "INSTALEAZĂ" PLUGIN-UL (mereu sub scriptul principal de mai sus) -->
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>
    
    <style>
        body { display: flex; margin: 0; height: 100vh; font-family: Arial, sans-serif; background: #1e1e1e; color: #fff;}
        #harta { width: 65%; height: 100%; }
        #panou-info { width: 35%; height: 100%; padding: 20px; overflow-y: auto; box-sizing: border-box; border-left: 2px solid #333;}
        .sketchfab-embed { width: 100%; height: 350px; border: none; border-radius: 8px; margin-bottom: 15px;}
        h2 { margin-top: 0; color: #e0a96d; }
    </style>
</head>
<body>

    <div id="harta"></div>
    <div id="panou-info">
        <h2 id="titlu-afloriment">Selectează un punct</h2>
        <div id="container-3d">
            <p>Dă click pe un marker de pe hartă pentru a încărca modelul 3D și detaliile.</p>
        </div>
        <p id="descriere-afloriment"></p>
    </div>

    <script>
        // 1. Inițializăm harta
        var map = L.map('harta').setView([46.5833, 22.6246], 11); 

        // 2. Google Maps
        var googleSatelit = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: 'Google Satellite'
        });
        googleSatelit.addTo(map);

        // 3. Harta Geologică
        var imageUrl = '056-A-Pietroasa.png'; 
        var imageBounds = [[46.494811, 22.492368], [46.671815, 22.756864]]; 
        var hartaGeologica = L.imageOverlay(imageUrl, imageBounds, {opacity: 1.0});
        hartaGeologica.addTo(map);

        // 3.1. Butonul Layer
        var straturiSuprapuse = {
            "056-A-Pietroasa": hartaGeologica
        };
        L.control.layers(null, straturiSuprapuse, {collapsed: false}).addTo(map);

        // --- SISTEMUL NOU PENTRU KMZ ---

        // Funcția care se execută când dai click pe un punct (On Clicked Event)
        function incarcaModel(eveniment) {
            // Extragem Titlul și Descrierea din punctul KMZ
            var numePunct = eveniment.layer.feature.properties.name;
            var idSketchfab = eveniment.layer.feature.properties.description; 
            
            // Curățăm ID-ul de posibile coduri ascunse pe care le mai adaugă Google
            if (idSketchfab) {
                idSketchfab = idSketchfab.replace(/(<([^>]+)>)/gi, "").trim();
            } else {
                idSketchfab = "";
            }

            // Setăm titlul în dreapta
            document.getElementById('titlu-afloriment').innerText = numePunct;
            
            // Dacă am găsit un ID valid în descriere, încărcăm iframe-ul
            if (idSketchfab.length > 5) {
                document.getElementById('container-3d').innerHTML = `
                    <iframe class="sketchfab-embed" 
                        src="https://sketchfab.com/models/${idSketchfab}/embed?autostart=1&ui_infos=0&ui_inspector=1" 
                        allow="autoplay; fullscreen; vr">
                    </iframe>
                `;
                document.getElementById('descriere-afloriment').innerText = "Model 3D interactiv.";
            } else {
                // Dacă punctul nu are ID (e doar un marker de ghidaj)
                document.getElementById('container-3d').innerHTML = "<p>Niciun model 3D asociat acestui punct.</p>";
                document.getElementById('descriere-afloriment').innerText = "Lipsește ID-ul Sketchfab din My Maps.";
            }
        }

        // Inițializăm plugin-ul și îi spunem să asculte click-urile
        var kmzParser = L.kmzLayer().addTo(map);
        kmzParser.on('click', incarcaModel);

        // Încărcăm fișierul tău fizic de lângă index.html
        kmzParser.load('puncte.kmz');

    </script>
</body>
</html>

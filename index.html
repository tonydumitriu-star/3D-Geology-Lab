<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hartă Geologică 3D - Pietroasa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { display: flex; margin: 0; height: 100vh; font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; }
        #harta { width: 65%; height: 100%; position: relative; }
        #panou-info { width: 35%; height: 100%; padding: 25px; overflow-y: auto; box-sizing: border-box; border-left: 2px solid #333; }
        .sketchfab-embed { width: 100%; height: 280px; border: none; border-radius: 8px; margin-bottom: 15px; display: none; }
        .panou-img { width: 100%; max-height: 240px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; border: 1px solid #444; display: none; }
        h2 { margin-top: 0; color: #e0a96d; font-size: 22px; }
        .detalii-text { font-size: 14px; line-height: 1.6; margin-top: 15px; color: #ddd; background: #252525; padding: 15px; border-radius: 6px; border: 1px solid #3a3a3a; white-space: pre-line; }
        
        #badge-versiune {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #e0a96d;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 1000;
            border: 1px solid #444;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="harta">
        <div id="badge-versiune">Versiune: v1.0.16</div>
    </div>

    <div id="panou-info">
        <h2 id="titlu-afloriment">Selectează un punct</h2>
        <iframe id="iframe-sketchfab" class="sketchfab-embed" allow="autoplay; fullscreen; vr"></iframe>
        <img id="img-afloriment" class="panou-img" alt="Fotografie afloriment">
        <div id="continut-detalii"></div>
    </div>

    <script>
        // 1. Inițializăm harta
        var map = L.map('harta', {
            zoomControl: true,
            dragging: true
        }).setView([46.5833, 22.6246], 11); 

        // 2. Google Satellite Base
        var googleSatelit = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: 'Google Satellite'
        });
        googleSatelit.addTo(map);

        // 3. Harta Geologică Overlay
        var imageUrl = '056-A-Pietroasa.png'; 
        var imageBounds = [[46.494811, 22.492368], [46.671815, 22.756864]]; 
        var hartaGeologica = L.imageOverlay(imageUrl, imageBounds, {opacity: 1.0});
        hartaGeologica.addTo(map);

        var straturiSuprapuse = {
            "056-A-Pietroasa": hartaGeologica
        };
        L.control.layers(null, straturiSuprapuse, {collapsed: false}).addTo(map);

        // Parsare Sketchfab robustă
        function obtineEmbedSketchfab(link) {
            if (!link || typeof link !== 'string') return null;
            link = link.trim();
            if (link.includes("skfb.ly/")) {
                var cod = link.split("skfb.ly/")[1].trim().split(/[\s/?#]+/)[0];
                return `https://sketchfab.com/models/${cod}/embed`;
            }
            if (link.includes("sketchfab.com/3d-models/")) {
                var parti = link.split("-");
                var potentialId = parti[parti.length - 1].trim().split(/[\s/?#]+/)[0];
                if (potentialId.length > 5) {
                    return `https://sketchfab.com/models/${potentialId}/embed`;
                }
            }
            return null;
        }

        // Funcție pentru afișarea datelor în panou
        function afiseazaDetaliiJson(props) {
            var codId = props.Identification_Code || props.name || "Afloriment";
            document.getElementById('titlu-afloriment').innerText = codId;

            // --- 1. GESTIUNE SKETCHFAB ---
            var linkSkfb = props["3D_Model"] || "";
            var iframeSkfb = document.getElementById('iframe-sketchfab');
            var embedUrl = obtineEmbedSketchfab(linkSkfb);
            
            if (embedUrl) {
                iframeSkfb.src = `${embedUrl}?autostart=1&ui_infos=0&ui_inspector=1`;
                iframeSkfb.style.display = "block";
            } else {
                iframeSkfb.src = "";
                iframeSkfb.style.display = "none";
            }

            // --- 2. GESTIUNE FOTO DIRECT DIN gx_media_links ---
            var imgAfloriment = document.getElementById('img-afloriment');
            var mediaLinks = props.gx_media_links || "";
            
            if (mediaLinks.trim() !== "" && mediaLinks.startsWith("http")) {
                imgAfloriment.src = mediaLinks.trim();
                imgAfloriment.style.display = "block";
            } else {
                imgAfloriment.src = "";
                imgAfloriment.style.display = "none";
            }

            // --- 3. CONSTRUIRE TEXT DETALII ---
            var textFormatat = "";
            if (props.KML_FOLDER) textFormatat += `Regiune/Folder: ${props.KML_FOLDER}\n`;
            if (props.Short_Description) textFormatat += `Descriere: ${props.Short_Description}\n`;
            if (props.Geological_Time || props.Geological_age) textFormatat += `Vârstă geologică: ${props.Geological_Time || props.Geological_age}\n`;
            if (props.Other) textFormatat += `Altele: ${props.Other}\n`;
            if (props.References) textFormatat += `Referințe: ${props.References}`;

            var containerDetalii = document.getElementById('continut-detalii');
            if (textFormatat.trim().length > 0) {
                containerDetalii.className = "detalii-text";
                containerDetalii.innerText = textFormatat.trim();
            } else {
                containerDetalii.className = "";
                containerDetalii.innerHTML = "";
            }
        }

        // Încărcare GeoJSON nativă
        fetch('puncte.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function(e) {
                            L.DomEvent.stopPropagation(e);
                            if (layer.closePopup) {
                                layer.closePopup();
                            }
                            afiseazaDetaliiJson(feature.properties);
                        });
                    }
                }).addTo(map);
            })
            .catch(error => console.log('Eroare la încărcarea fișierului GeoJSON:', error));
    </script>
</body>
</html>

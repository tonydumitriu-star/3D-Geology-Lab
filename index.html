<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hartă Geologică 3D - Pietroasa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { display: flex; margin: 0; height: 100vh; font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; }
        #harta { width: 65%; height: 100%; position: relative; }
        #panou-info { width: 35%; height: 100%; padding: 25px; overflow-y: auto; box-sizing: border-box; border-left: 2px solid #333; }
        
        .sketchfab-embed { width: 100%; height: 260px; border: none; border-radius: 8px; margin-bottom: 15px; display: none; }
        
        /* Carusel Media */
        .carusel-container { position: relative; width: 100%; height: 240px; background: #111; border-radius: 6px; margin-bottom: 15px; display: none; overflow: hidden; border: 1px solid #444; }
        .carusel-slide { width: 100%; height: 100%; display: none; justify-content: center; align-items: center; }
        .carusel-slide.active { display: flex; }
        .carusel-slide img, .carusel-slide iframe { width: 100%; height: 100%; object-fit: contain; border: none; }
        .carusel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: #fff; border: none; padding: 8px 12px; cursor: pointer; z-index: 10; font-size: 16px; border-radius: 4px; }
        .carusel-btn.prev { left: 10px; }
        .carusel-btn.next { right: 10px; }
        .carusel-btn:hover { background: #e0a96d; color: #000; }

        h2 { margin-top: 0; color: #e0a96d; font-size: 22px; }
        .detalii-text { font-size: 14px; line-height: 1.6; margin-top: 15px; color: #ddd; background: #252525; padding: 15px; border-radius: 6px; border: 1px solid #3a3a3a; white-space: pre-line; }
        
        #badge-versiune {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #e0a96d;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 1000;
            border: 1px solid #444;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="harta">
        <div id="badge-versiune">Versiune: v1.0.24</div>
    </div>

    <!-- Panou Informații -->
    <div id="panou-info">
        <h2 id="titlu-afloriment">Selectează un punct</h2>
        
        <iframe id="iframe-sketchfab" class="sketchfab-embed" allow="autoplay; fullscreen; vr"></iframe>
        
        <div id="carusel-media" class="carusel-container">
            <button class="carusel-btn prev" onclick="schimbaSlide(-1)">&#10094;</button>
            <div id="carusel-slides-wrapper" style="width:100%; height:100%;"></div>
            <button class="carusel-btn next" onclick="schimbaSlide(1)">&#10095;</button>
        </div>

        <div id="continut-detalii"></div>
    </div>

    <script>
        var map = L.map('harta', { zoomControl: true, dragging: true }).setView([46.5833, 22.6246], 11); 

        var googleSatelit = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: 'Google Satellite' }).addTo(map);

        var imageUrl = '056-A-Pietroasa.png'; 
        var imageBounds = [[46.494811, 22.492368], [46.671815, 22.756864]]; 
        var hartaGeologica = L.imageOverlay(imageUrl, imageBounds, {opacity: 1.0}).addTo(map);

        L.control.layers(null, { "056-A-Pietroasa": hartaGeologica }, {collapsed: false}).addTo(map);

        var slideIndex = 0;

        function schimbaSlide(n) {
            var slides = document.getElementsByClassName("carusel-slide");
            if (slides.length === 0) return;
            slideIndex += n;
            if (slideIndex >= slides.length) slideIndex = 0;
            if (slideIndex < 0) slideIndex = slides.length - 1;
            
            for (var i = 0; i < slides.length; i++) {
                slides[i].classList.remove("active");
            }
            slides[slideIndex].classList.add("active");
        }

        function obtineEmbedSketchfab(link) {
            if (!link || typeof link !== 'string') return null;
            link = link.trim();
            if (link.includes("skfb.ly/")) {
                var cod = link.split("skfb.ly/")[1].trim().split(/[\s/?#]+/)[0];
                return `https://sketchfab.com/models/${cod}/embed`;
            }
            if (link.includes("sketchfab.com/3d-models/")) {
                var parti = link.split("-");
                var potentialId = parti[parti.length - 1].trim().split(/[\s/?#]+/)[0];
                if (potentialId.length > 5) {
                    return `https://sketchfab.com/models/${potentialId}/embed`;
                }
            }
            return null;
        }

        function afiseazaDetaliiPunct(props) {
            document.getElementById('titlu-afloriment').innerText = props.Identification_Code || props.name || "Afloriment";

            var embedUrl = obtineEmbedSketchfab(props["3D_Model"]);
            var iframeSkfb = document.getElementById('iframe-sketchfab');
            if (embedUrl) {
                iframeSkfb.src = `${embedUrl}?autostart=1&ui_infos=0&ui_inspector=1`;
                iframeSkfb.style.display = "block";
            } else {
                iframeSkfb.src = "";
                iframeSkfb.style.display = "none";
            }

            var wrapper = document.getElementById('carusel-slides-wrapper');
            wrapper.innerHTML = "";
            slideIndex = 0;
            var mediaLinks = props.gx_media_links || props.Media || "";
            
            if (mediaLinks.trim() !== "") {
                var linkuri = mediaLinks.split(/[\s,]+/);
                var totalSlides = 0;
                for (var i = 0; i < linkuri.length; i++) {
                    var htmlElement = convertesteLinkMediaDirect(linkuri[i]);
                    if (htmlElement) {
                        var div = document.createElement('div');
                        div.className = "carusel-slide" + (totalSlides === 0 ? " active" : "");
                        div.innerHTML = htmlElement;
                        wrapper.appendChild(div);
                        totalSlides++;
                    }
                }
                document.getElementById('carusel-media').style.display = totalSlides > 0 ? "block" : "none";
            } else {
                document.getElementById('carusel-media').style.display = "none";
            }

            var textFormatat = "";
            if (props.KML_FOLDER) textFormatat += `Regiune/Folder: ${props.KML_FOLDER}\n`;
            if (props.Short_Description) textFormatat += `Descriere: ${props.Short_Description}\n`;
            if (props.Geological_Time || props.Geological_age) textFormatat += `Vârstă: ${props.Geological_Time || props.Geological_age}\n`;
            if (props.Other) textFormatat += `Note: ${props.Other}\n`;
            if (props.References) textFormatat += `Referințe: ${props.References}`;

            document.getElementById('continut-detalii').className = textFormatat ? "detalii-text" : "";
            document.getElementById('continut-detalii').innerText = textFormatat;
        }

        function convertesteLinkMediaDirect(link) {
            link = link.trim();
            if (link.includes("drive.google.com") && link.includes("/d/")) {
                var matchId = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (matchId && matchId[1]) return `<img src="https://lh3.googleusercontent.com/d/${matchId[1]}" alt="Foto">`;
            }
            if (link.includes("youtu.be/") || link.includes("youtube.com/watch")) {
                var vid = link.includes("youtu.be/") ? link.split("youtu.be/")[1].split("?")[0] : link.split("watch?v=")[1].split("&")[0];
                return `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`;
            }
            if (link.startsWith("http")) return `<img src="${link}" alt="Foto">`;
            return null;
        }

        // Încărcare sigură și directă din puncte.geojson
        fetch('puncte.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.marker(latlng);
                    },
                    onEachFeature: function(feature, layer) {
                        var codId = feature.properties.Identification_Code || feature.properties.name || "Punct";
                        layer.bindTooltip(codId, {permanent: false, direction: 'top'});
                        
                        layer.on('click', function(e) {
                            L.DomEvent.stopPropagation(e);
                            if (layer.closePopup) layer.closePopup();
                            afiseazaDetaliiPunct(feature.properties);
                        });
                    }
                }).addTo(map);
            })
            .catch(err => console.log("Eroare la încărcarea fișierului puncte.geojson:", err));
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hartă Geologică 3D & Pin Ciocan Vectorial - Pietroasa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <style>
        body { display: flex; margin: 0; height: 100vh; font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; }
        #harta { width: 65%; height: 100%; position: relative; }
        #panou-info { width: 35%; height: 100%; padding: 25px; overflow-y: auto; box-sizing: border-box; border-left: 2px solid #333; }
        
        .sketchfab-embed { width: 100%; height: 260px; border: none; border-radius: 8px; margin-bottom: 15px; display: none; }
        
        /* Carusel Media */
        .carusel-container { position: relative; width: 100%; height: 240px; background: #111; border-radius: 6px; margin-bottom: 15px; display: none; overflow: hidden; border: 1px solid #444; }
        .carusel-slide { width: 100%; height: 100%; display: none; justify-content: center; align-items: center; }
        .carusel-slide.active { display: flex; }
        .carusel-slide img, .carusel-slide iframe { width: 100%; height: 100%; object-fit: contain; border: none; }
        .carusel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: #fff; border: none; padding: 8px 12px; cursor: pointer; z-index: 10; font-size: 16px; border-radius: 4px; }
        .carusel-btn.prev { left: 10px; }
        .carusel-btn.next { right: 10px; }
        .carusel-btn:hover { background: #e0a96d; color: #000; }

        h2 { margin-top: 0; color: #e0a96d; font-size: 22px; }
        .detalii-text { font-size: 14px; line-height: 1.6; margin-top: 15px; color: #ddd; background: #252525; padding: 15px; border-radius: 6px; border: 1px solid #3a3a3a; white-space: pre-line; }
        
        /* Butoane sus în dreapta */
        .btn-grup { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .btn-actiune { background: #e0a96d; color: #1e1e1e; border: none; padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-actiune:hover { background: #f0b97d; }
        .btn-export { background: #4CAF50; color: white; }
        .btn-export:hover { background: #45a049; }
        .btn-refresh { background: #2196F3; color: white; }
        .btn-refresh:hover { background: #0b7dda; }

        .btn-editeaza-selectat { background: #2196F3; color: white; display: none; margin-top: 15px; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-editeaza-selectat:hover { background: #0b7dda; }
        
        /* Pin Vectorial Geologic Stilizat (Bazat pe designul tău cu ciocănel) */
        .marker-afloriment-custom {
            background: linear-gradient(135deg, #3a4149, #1f242b);
            border: 2px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            width: 34px;
            height: 34px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .marker-afloriment-custom:hover {
            transform: rotate(-45deg) scale(1.15);
        }
        /* Interiorul pinului care conține simbolul de ciocănel stilizat */
        .marker-afloriment-custom::after {
            content: '🔨';
            font-size: 16px;
            transform: rotate(45deg);
            display: block;
        }

        /* Stil Personalizat pentru Clustere */
        .custom-cluster-icon {
            background: linear-gradient(135deg, #e0a96d, #c68b59);
            border: 2px solid #ffffff;
            border-radius: 50%;
            text-align: center;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            font-size: 13px;
            line-height: 32px;
        }

        /* Control straturi jos în stânga */
        .leaflet-bottom.leaflet-left { bottom: 40px !important; left: 10px !important; }
        .leaflet-control-layers {
            background: rgba(30, 30, 30, 0.95) !important;
            color: #fff !important;
            border: 1px solid #555 !important;
            border-radius: 6px !important;
            padding: 8px !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
        }
        .leaflet-control-layers-expanded { color: #fff !important; background: rgba(30, 30, 30, 0.98) !important; }
        .leaflet-control-layers label { color: #e0a96d !important; font-weight: bold; font-size: 13px; cursor: pointer; }

        /* Ferestre Modale */
        .modal-admin { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2a2a2a; border: 2px solid #e0a96d; padding: 25px; z-index: 2000; width: 520px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .modal-admin h3 { margin-top: 0; color: #e0a96d; }
        .modal-admin label { display: block; margin-top: 10px; font-size: 13px; color: #ccc; }
        .modal-admin input, .modal-admin textarea { width: 100%; padding: 8px; margin-top: 5px; background: #1e1e1e; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .modal-admin textarea { height: 70px; resize: vertical; }
        .modal-buttons { margin-top: 15px; display: flex; gap: 10px; justify-content: space-between; }
        .modal-buttons button { padding: 8px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-salveaza { background: #ff9800; color: white; }
        .btn-inchide { background: #f44336; color: white; }
        #rezultat-json { font-family: monospace; font-size: 11px; background: #111; color: #a6e22e; height: 250px; }

        #badge-versiune {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #e0a96d;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 1000;
            border: 1px solid #444;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="harta">
        <div class="btn-grup">
            <button class="btn-actiune" onclick="activeazaModDragDrop()">+ Adaugă Punct Nou</button>
            <button class="btn-actiune btn-export" onclick="deschideModalExport()">📁 Generează GeoJSON Final</button>
            <button class="btn-actiune btn-refresh" onclick="reprospateazaHartaFortat()">🔄 Reîmprospătează Forțat</button>
        </div>
        <div id="badge-versiune">Versiune: v1.0.70</div>
    </div>

    <!-- Panou Informații -->
    <div id="panou-info">
        <h2 id="titlu-afloriment">Selectează un punct</h2>
        
        <iframe id="iframe-sketchfab" class="sketchfab-embed" allow="autoplay; fullscreen; vr" allowfullscreen="true"></iframe>
        
        <div id="carusel-media" class="carusel-container">
            <button class="carusel-btn prev" onclick="schimbaSlide(-1)">&#10094;</button>
            <div id="carusel-slides-wrapper" style="width:100%; height:100%;"></div>
            <button class="carusel-btn next" onclick="schimbaSlide(1)">&#10095;</button>
        </div>

        <div id="continut-detalii"></div>
        
        <button id="btn-editeaza" class="btn-editeaza-selectat" onclick="deschideModEditarePunctCurent()">Editează acest punct</button>
    </div>

    <!-- Modal 1: Adăugare / Editare Punct -->
    <div id="modal-punct" class="modal-admin">
        <h3 id="modal-titlu">Administrare Punct GeoJSON</h3>
        <p id="modal-descriere-text" style="font-size: 12px; color: #aaa; margin-top:0;">Completează datele și salvează.</p>
        
        <label>Cod Identificare (ex: H101):</label>
        <input type="text" id="input-cod" placeholder="H101">

        <label>Latitudine:</label>
        <input type="text" id="input-lat" readonly style="color: #00ffcc; background: #151515;">

        <label>Longitudine:</label>
        <input type="text" id="input-lon" readonly style="color: #00ffcc; background: #151515;">

        <label>Descriere / Vârstă geologică:</label>
        <textarea id="input-desc" placeholder="Descriere afloriment..."></textarea>

        <label>Link sau Cod HTML Embed Sketchfab:</label>
        <textarea id="input-skfb" placeholder="https://sketchfab.com/models/... sau codul complet <iframe ...>"></textarea>

        <label>Link-uri Poze / Filme Drive:</label>
        <textarea id="input-media" placeholder="https://drive.google.com/file/d/..."></textarea>

        <div class="modal-buttons" style="margin-top: 20px;">
            <button class="btn-salveaza" onclick="salveazaPunctInSesiune()">Salvează Punctul</button>
            <button class="btn-inchide" onclick="inchideModalPunct()">Anulează</button>
        </div>
    </div>

    <!-- Modal 2: Vizualizare Cod GeoJSON Final -->
    <div id="modal-export" class="modal-admin">
        <h3>Codul GeoJSON Final (Complet)</h3>
        <p style="font-size: 12px; color: #aaa; margin-top:0;">Copiază tot acest cod și înlocuiește conținutul fișierului tău `puncte.geojson`.</p>
        
        <textarea id="rezultat-json" readonly></textarea>

        <div class="modal-buttons" style="margin-top: 20px;">
            <button class="btn-salveaza" onclick="copiazaCodulInMemorie()" style="background: #2196F3;">Copiază în Clipboard</button>
            <button class="btn-inchide" onclick="inchideModalExport()">Închide</button>
        </div>
    </div>

    <script>
        var map = L.map('harta', { zoomControl: true, dragging: true }).setView([46.5833, 22.6246], 11); 

        var googleSatelit = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: 'Google Satellite' }).addTo(map);

        var imageUrl = '056-A-Pietroasa.png'; 
        var imageBounds = [[46.494811, 22.492368], [46.671815, 22.756864]]; 
        var hartaGeologica = L.imageOverlay(imageUrl, imageBounds, {opacity: 1.0});
        hartaGeologica.addTo(map);

        var controlStraturi = L.control.layers(null, { "056-A-Pietroasa": hartaGeologica }, {collapsed: false, position: 'bottomleft'});
        controlStraturi.addTo(map);

        setTimeout(function() {
            map.invalidateSize();
        }, 200);

        var slideIndex = 0;
        var pinMobil = null;

        var toatePuncteleExistente = [
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "aqwfdasd",
                    "Short_Description": "afsdfasfd",
                    "3D_Model": "https://sketchfab.com/models/7dd2382a2d1d4cec83be3ad8af7db995/embed",
                    "gx_media_links": "https://drive.google.com/file/d/1bN-MDS33g0ZDoeXhvoPVG3d2qyz28kHL/view?usp=drive_link\nhttps://drive.google.com/file/d/1bHa89aW5HjUP3ajgxvQn8Q2X4Wa2SBSO/view?usp=drive_link"
                },
                "geometry": { "type": "Point", "coordinates": [22.627716, 46.742213] }
            },
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "sdfw32svc",
                    "Short_Description": "sa\\c sdac\\scsc  sadf asf34",
                    "3D_Model": "https://sketchfab.com/models/7dd2382a2d1d4cec83be3ad8af7db995/embed",
                    "gx_media_links": "https://drive.google.com/file/d/116NiwNTdFvV_-r1YOFtmEVhqJHebFac_/view?usp=drive_link\nhttps://drive.google.com/file/d/12Fn9AYw8DTH5E4OlzqStVoEh3XkEuxfY/view?usp=drive_link"
                },
                "geometry": { "type": "Point", "coordinates": [22.550125, 46.819798] }
            },
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "asdfasF",
                    "Short_Description": "AWSEFAWSF",
                    "3D_Model": "https://sketchfab.com/models/7dd2382a2d1d4cec83be3ad8af7db995/embed",
                    "gx_media_links": ""
                },
                "geometry": { "type": "Point", "coordinates": [22.274094, 46.578215] }
            },
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "ZSGV",
                    "Short_Description": "",
                    "3D_Model": "https://sketchfab.com/models/7dd2382a2d1d4cec83be3ad8af7db995/embed",
                    "gx_media_links": ""
                },
                "geometry": { "type": "Point", "coordinates": [22.646942, 46.426972] }
            },
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "qwwqdQD",
                    "Short_Description": "qwdQWD",
                    "3D_Model": "https://skfb.ly/oIGTu",
                    "gx_media_links": ""
                },
                "geometry": { "type": "Point", "coordinates": [22.624283, 46.58317] }
            },
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "ASF",
                    "Short_Description": "ASFAFS",
                    "3D_Model": "<div class=\"sketchfab-embed-wrapper\"> <iframe title=\"Outcrop (IPD_2023_ Af_1-Malusteni)\" frameborder=\"0\" allowfullscreen mozallowfullscreen=\"true\" webkitallowfullscreen=\"true\" allow=\"autoplay; fullscreen; xr-spatial-tracking\" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share src=\"https://sketchfab.com/models/ba84651817f44b2481c6244f46d59aae/embed\"> </iframe> </div>",
                    "gx_media_links": ""
                },
                "geometry": { "type": "Point", "coordinates": [22.940826, 46.697493] }
            },
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "1",
                    "Short_Description": "aasd",
                    "3D_Model": "https://skfb.ly/oIGSY",
                    "gx_media_links": ""
                },
                "geometry": { "type": "Point", "coordinates": [22.624283, 46.58317] }
            },
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "2",
                    "Short_Description": "asfw",
                    "3D_Model": "https://skfb.ly/oIGSY",
                    "gx_media_links": ""
                },
                "geometry": { "type": "Point", "coordinates": [23.171539, 46.314687] }
            },
            {
                "type": "Feature",
                "properties": {
                    "Identification_Code": "5553q21145",
                    "Short_Description": "awefawf",
                    "3D_Model": "<div class=\"sketchfab-embed-wrapper\"> <iframe title=\"Outcrop (IPD_2023_ Af_3-Beresti)\" frameborder=\"0\" allowfullscreen mozallowfullscreen=\"true\" webkitallowfullscreen=\"true\" allow=\"autoplay; fullscreen; xr-spatial-tracking\" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share src=\"https://sketchfab.com/models/7dd2382a2d1d4cec83be3ad8af7db995/embed\"> </iframe> </div>",
                    "gx_media_links": ""
                },
                "geometry": { "type": "Point", "coordinates": [22.885208, 46.308996] }
            }
        ]; 
        var puncteModificateSauNoi = {}; 

        var clusterPuncteHarta = L.markerClusterGroup({
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true,
            iconCreateFunction: function(cluster) {
                var childCount = cluster.getChildCount();
                return L.divIcon({
                    html: `<div class="custom-cluster-icon" style="width: 36px; height: 36px;">${childCount}</div>`,
                    className: 'custom-cluster-wrapper',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
            }
        });
        map.addLayer(clusterPuncteHarta);

        var punctCurentSelectat = null;

        function schimbaSlide(n) {
            var slides = document.getElementsByClassName("carusel-slide");
            if (slides.length === 0) return;
            slideIndex += n;
            if (slideIndex >= slides.length) slideIndex = 0;
            if (slideIndex < 0) slideIndex = slides.length - 1;
            
            for (var i = 0; i < slides.length; i++) {
                slides[i].classList.remove("active");
            }
            slides[slideIndex].classList.add("active");
        }

        function reprospateazaHartaFortat() {
            var timestamp = new Date().getTime();
            window.location.href = window.location.pathname + '?v=' + timestamp;
        }

        function obtineEmbedSketchfab(link) {
            if (!link || typeof link !== 'string') return null;
            link = link.trim();
            if (link.includes("<iframe")) {
                var matchSrc = link.match(/src="([^"]+)"/);
                if (matchSrc && matchSrc[1]) {
                    link = matchSrc[1];
                }
            }
            if (link.includes("/embed")) {
                return link.split("?")[0];
            }
            if (link.includes("skfb.ly/")) {
                var cod = link.split("skfb.ly/")[1].trim().split(/[\s/?#]+/)[0];
                if (cod) {
                    return `https://sketchfab.com/models/${cod}/embed`;
                }
            }
            var segmente = link.split('/');
            for (var i = 0; i < segmente.length; i++) {
                if (segmente[i].length === 32) {
                    return `https://sketchfab.com/models/${segmente[i]}/embed`;
                }
            }
            return null;
        }

        function afiseazaDetaliiPunct(feature) {
            var props = feature.properties;
            punctCurentSelectat = feature;
            
            document.getElementById('titlu-afloriment').innerText = props.Identification_Code || props.name || "Afloriment";

            var embedUrl = obtineEmbedSketchfab(props["3D_Model"]);
            var iframeSkfb = document.getElementById('iframe-sketchfab');
            if (embedUrl) {
                iframeSkfb.src = `${embedUrl}?autostart=1&ui_infos=0&ui_inspector=1`;
                iframeSkfb.style.display = "block";
            } else {
                iframeSkfb.src = "";
                iframeSkfb.style.display = "none";
            }

            var wrapper = document.getElementById('carusel-slides-wrapper');
            wrapper.innerHTML = "";
            slideIndex = 0;
            var mediaLinks = props.gx_media_links || props.Media || "";
            
            if (mediaLinks.trim() !== "") {
                var linkuri = mediaLinks.split(/[\s,]+/);
                var totalSlides = 0;
                for (var i = 0; i < linkuri.length; i++) {
                    var htmlElement = convertesteLinkMediaDirect(linkuri[i]);
                    if (htmlElement) {
                        var div = document.createElement('div');
                        div.className = "carusel-slide" + (totalSlides === 0 ? " active" : "");
                        div.innerHTML = htmlElement;
                        wrapper.appendChild(div);
                        totalSlides++;
                    }
                }
                document.getElementById('carusel-media').style.display = totalSlides > 0 ? "block" : "none";
            } else {
                document.getElementById('carusel-media').style.display = "none";
            }

            var textFormatat = "";
            if (props.KML_FOLDER) textFormatat += `Regiune/Folder: ${props.KML_FOLDER}\n`;
            if (props.Short_Description) textFormatat += `Descriere: ${props.Short_Description}\n`;
            if (props.Geological_Time || props.Geological_age) textFormatat += `Vârstă: ${props.Geological_Time || props.Geological_age}\n`;
            if (props.Other) textFormatat += `Note: ${props.Other}\n`;
            if (props.References) textFormatat += `Referințe: ${props.References}`;

            document.getElementById('continut-detalii').className = textFormatat ? "detalii-text" : "";
            document.getElementById('continut-detalii').innerText = textFormatat;

            document.getElementById('btn-editeaza').style.display = "block";
        }

        function convertesteLinkMediaDirect(link) {
            link = link.trim();
            if (link.includes("drive.google.com") && link.includes("/d/")) {
                var matchId = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (matchId && matchId[1]) return `<img src="https://lh3.googleusercontent.com/d/${matchId[1]}" alt="Foto">`;
            }
            if (link.includes("youtu.be/") || link.includes("youtube.com/watch")) {
                var vid = link.includes("youtu.be/") ? link.split("youtu.be/")[1].split("?")[0] : link.split("watch?v=")[1].split("&")[0];
                return `<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen></iframe>`;
            }
            if (link.startsWith("http")) return `<img src="${link}" alt="Foto">`;
            return null;
        }

        function incarcaHartaPuncte() {
            clusterPuncteHarta.clearLayers();
            
            var toatePuncteleFinal = toatePuncteleExistente.map(function(pt) {
                var cod = pt.properties.Identification_Code;
                if (cod && puncteModificateSauNoi[cod]) {
                    return puncteModificateSauNoi[cod];
                }
                return pt;
            });

            for (var cod in puncteModificateSauNoi) {
                var eNou = true;
                for (var i = 0; i < toatePuncteleExistente.length; i++) {
                    if (toatePuncteleExistente[i].properties.Identification_Code === cod) {
                        eNou = false;
                        break;
                    }
                }
                if (eNou) {
                    toatePuncteleFinal.push(puncteModificateSauNoi[cod]);
                }
            }

            toatePuncteleFinal.forEach(function(feature, index) {
                var coords = feature.geometry.coordinates;
                var latlng = [coords[1], coords[0]];
                var numarIndex = index + 1;

                // Folosim pinul stilizat bazat pe designul tău cu ciocănel
                var customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="marker-afloriment-custom"></div>`,
                    iconSize: [34, 34],
                    iconAnchor: [17, 34]
                });

                var marker = L.marker(latlng, { icon: customIcon });

                var codId = feature.properties.Identification_Code || `Punct ${numarIndex}`;
                marker.bindTooltip(`<b>Afloriment: ${codId}</b>`, {permanent: false, direction: 'top'});

                marker.on('click', function(e) {
                    L.DomEvent.stopPropagation(e);
                    afiseazaDetaliiPunct(feature);
                });

                clusterPuncteHarta.addLayer(marker);
            });
        }

        incarcaHartaPuncte();

        function activeazaModDragDrop() {
            var centru = map.getCenter();
            
            if (pinMobil) {
                map.removeLayer(pinMobil);
            }

            document.getElementById('modal-titlu').innerText = "Adaugă Punct Nou";
            document.getElementById('modal-descriere-text').innerText = "Trage bulina roșie pe hartă exact unde ai nevoie.";

            document.getElementById('input-cod').value = "";
            document.getElementById('input-lat').value = centru.lat.toFixed(6);
            document.getElementById('input-lon').value = centru.lng.toFixed(6);
            document.getElementById('input-desc').value = "";
            document.getElementById('input-skfb').value = "";
            document.getElementById('input-media').value = "";
            document.getElementById('input-cod').readOnly = false;

            pinMobil = L.circleMarker([centru.lat, centru.lng], {
                radius: 14,
                color: '#ffffff',
                weight: 3,
                fillColor: '#ff0033',
                fillOpacity: 1.0,
                draggable: true
            }).addTo(map);

            pinMobil.bindPopup("<b>Trage bulina roșie pe afloriment!</b>").openPopup();

            function actualizeazaCoordonatePin() {
                var latlng = pinMobil.getLatLng();
                document.getElementById('input-lat').value = latlng.lat.toFixed(6);
                document.getElementById('input-lon').value = latlng.lng.toFixed(6);
            }

            var isDragging = false;
            pinMobil.on('mousedown', function() { isDragging = true; map.dragging.disable(); });
            map.on('mousemove', function(e) {
                if (isDragging) {
                    pinMobil.setLatLng(e.latlng);
                    actualizeazaCoordonatePin();
                }
            });
            map.on('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    map.dragging.enable();
                    actualizeazaCoordonatePin();
                    document.getElementById('modal-punct').style.display = "block";
                }
            });

            document.getElementById('modal-punct').style.display = "block";
        }

        function deschideModEditarePunctCurent() {
            if (!punctCurentSelectat) return;

            var props = punctCurentSelectat.properties;
            var coords = punctCurentSelectat.geometry.coordinates;

            document.getElementById('modal-titlu').innerText = "Editează Punctul: " + (props.Identification_Code || "");
            document.getElementById('modal-descriere-text').innerText = "Modifică detaliile și apasă Salvează Punctul.";

            document.getElementById('input-cod').value = props.Identification_Code || "";
            document.getElementById('input-cod').readOnly = true; 
            document.getElementById('input-lat').value = coords[1].toFixed(6);
            document.getElementById('input-lon').value = coords[0].toFixed(6);
            document.getElementById('input-desc').value = props.Short_Description || "";
            document.getElementById('input-skfb').value = props["3D_Model"] || "";
            document.getElementById('input-media').value = props.gx_media_links || "";

            document.getElementById('modal-punct').style.display = "block";
        }

        function salveazaPunctInSesiune() {
            var cod = document.getElementById('input-cod').value.trim();
            var lat = parseFloat(document.getElementById('input-lat').value);
            var lon = parseFloat(document.getElementById('input-lon').value);
            var desc = document.getElementById('input-desc').value;
            var skfb = document.getElementById('input-skfb').value;
            var media = document.getElementById('input-media').value;

            if (!cod || isNaN(lat) || isNaN(lon)) {
                alert("Completează codul și coordonatele!");
                return;
            }

            var featureModificat = {
                "type": "Feature",
                "properties": {
                    "Identification_Code": cod,
                    "Short_Description": desc,
                    "3D_Model": skfb,
                    "gx_media_links": media
                },
                "geometry": {
                    "type": "Point",
                    "coordinates": [lon, lat]
                }
            };

            puncteModificateSauNoi[cod] = featureModificat;

            alert(`Punctul "${cod}" a fost salvat cu succes în sesiune!`);
            document.getElementById('modal-punct').style.display = "none";
            if (pinMobil) {
                map.removeLayer(pinMobil);
                pinMobil = null;
            }

            incarcaHartaPuncte(); 
            afiseazaDetaliiPunct(featureModificat); 
        }

        function deschideModalExport() {
            var toatePuncteleFinal = toatePuncteleExistente.map(function(pt) {
                var cod = pt.properties.Identification_Code;
                if (cod && puncteModificateSauNoi[cod]) {
                    return puncteModificateSauNoi[cod];
                }
                return pt;
            });

            for (var cod in puncteModificateSauNoi) {
                var eNou = true;
                for (var i = 0; i < toatePuncteleExistente.length; i++) {
                    if (toatePuncteleExistente[i].properties.Identification_Code === cod) {
                        eNou = false;
                        break;
                    }
                }
                if (eNou) {
                    toatePuncteleFinal.push(puncteModificateSauNoi[cod]);
                }
            }

            var colectieFinala = {
                "type": "FeatureCollection",
                "features": toatePuncteleFinal
            };

            document.getElementById('rezultat-json').value = JSON.stringify(colectieFinala, null, 2);
            document.getElementById('modal-export').style.display = "block";
        }

        function copiazaCodulInMemorie() {
            var textarea = document.getElementById('rezultat-json');
            textarea.select();
            document.execCommand('copy');
            alert("Codul GeoJSON a fost copiat în clipboard!");
        }

        function inchideModalPunct() {
            document.getElementById('modal-punct').style.display = "none";
            if (pinMobil) {
                map.removeLayer(pinMobil);
                pinMobil = null;
            }
        }

        function inchideModalExport() {
            document.getElementById('modal-export').style.display = "none";
        }
    </script>
</body>
</html>

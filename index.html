<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hartă Geologică 3D - Pietroasa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>
    
    <style>
        body { display: flex; margin: 0; height: 100vh; font-family: Arial, sans-serif; background: #1e1e1e; color: #fff;}
        #harta { width: 65%; height: 100%; }
        #panou-info { width: 35%; height: 100%; padding: 25px; overflow-y: auto; box-sizing: border-box; border-left: 2px solid #333;}
        .sketchfab-embed { width: 100%; height: 300px; border: none; border-radius: 8px; margin-bottom: 20px;}
        h2 { margin-top: 0; color: #e0a96d; font-size: 22px; }
        .detalii-text { font-size: 14px; line-height: 1.6; margin-top: 15px; color: #ddd; background: #252525; padding: 15px; border-radius: 6px; border: 1px solid #3a3a3a; white-space: pre-line; }
    </style>
</head>
<body>

    <div id="harta"></div>
    <div id="panou-info">
        <h2 id="titlu-afloriment">Selectează un punct</h2>
        <div id="container-3d">
            <p style="color: #888; font-style: italic;">Dă click pe un punct de pe hartă pentru a încărca modelul 3D și fișa geologică.</p>
        </div>
        <div id="continut-detalii"></div>
    </div>

    <script>
        // 1. Inițializăm harta
        var map = L.map('harta').setView([46.5833, 22.6246], 11); 

        // 2. Google Satellite Base
        var googleSatelit = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: 'Google Satellite'
        });
        googleSatelit.addTo(map);

        // 3. Harta Geologică Overlay
        var imageUrl = '056-A-Pietroasa.png'; 
        var imageBounds = [[46.494811, 22.492368], [46.671815, 22.756864]]; 
        var hartaGeologica = L.imageOverlay(imageUrl, imageBounds, {opacity: 1.0});
        hartaGeologica.addTo(map);

        var straturiSuprapuse = {
            "056-A-Pietroasa": hartaGeologica
        };
        L.control.layers(null, straturiSuprapuse, {collapsed: false}).addTo(map);

        // --- FUNCȚIE STABILĂ DE PARSARE ---
        function gestioneazaClickPunct(eveniment) {
            // Oprim comportamentul care mută/teleportează harta
            if (eveniment.originalEvent) {
                L.DomEvent.stopPropagation(eveniment.originalEvent);
                L.DomEvent.preventDefault(eveniment.originalEvent);
            }

            var layer = eveniment.layer;
            
            // Preluăm proprietățile în siguranță indiferent de cum le exportă My Maps
            var props = (layer.feature && layer.feature.properties) ? layer.feature.properties : {};
            var numePunct = props.name || props.title || layer.options.title || "Afloriment fără titlu";
            var descriereBruta = props.description || props.popupContent || "";

            if (layer.closePopup) {
                layer.closePopup();
            }

            document.getElementById('titlu-afloriment').innerText = numePunct;

            // Căutare sigură a link-ului Sketchfab
            var skfbRegex = /(?:skfb\.ly\/[a-zA-Z0-9]+|sketchfab\.com\/3d-models\/[^\s"<>]+)/i;
            var matchSkfb = descriereBruta.match(skfbRegex);
            
            if (matchSkfb) {
                var linkGasit = matchSkfb[0];
                var embedSrc = linkGasit;
                if (linkGasit.includes("skfb.ly/")) {
                    var codScurt = linkGasit.split("skfb.ly/")[1].trim();
                    embedSrc = `https://sketchfab.com/models/${codScurt}/embed`;
                } else if (linkGasit.includes("sketchfab.com/3d-models/")) {
                    var parti = linkGasit.split("-");
                    var potentialId = parti[parti.length - 1].trim();
                    embedSrc = `https://sketchfab.com/models/${potentialId}/embed`;
                }
                
                document.getElementById('container-3d').innerHTML = `
                    <iframe class="sketchfab-embed" 
                        src="${embedSrc}?autostart=1&ui_infos=0&ui_inspector=1" 
                        allow="autoplay; fullscreen; vr">
                    </iframe>
                `;
            } else {
                document.getElementById('container-3d').innerHTML = `<p style="color: #888; font-style: italic;">Niciun model 3D asociat acestui punct.</p>`;
            }

            // Curățarea textului pentru afișare ordonată
            var tempDiv = document.createElement("div");
            tempDiv.innerHTML = descriereBruta;
            
            var imgs = tempDiv.getElementsByTagName('img');
            for (var k = imgs.length - 1; k >= 0; k--) {
                imgs[k].parentNode.removeChild(imgs[k]);
            }

            var textCurat = tempDiv.textContent || tempDiv.innerText || "";
            if (matchSkfb) {
                textCurat = textCurat.replace(matchSkfb[0], '');
            }

            var containerDetalii = document.getElementById('continut-detalii');
            if (textCurat.trim().length > 0) {
                containerDetalii.className = "detalii-text";
                containerDetalii.innerText = textCurat.trim();
            } else {
                containerDetalii.className = "";
                containerDetalii.innerHTML = "";
            }
        }

        // Inițializăm KMZ parser-ul și atașăm evenimentul pe fiecare punct în parte
        var kmzParser = L.kmzLayer().addTo(map);
        
        kmzParser.on('load', function(e) {
            e.layer.eachLayer(function (layer) {
                layer.on('click', gestioneazaClickPunct);
            });
        });

        kmzParser.load('puncte.kmz');

    </script>
</body>
</html>
